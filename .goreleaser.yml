version: 2

project_name: skuggsja

builds:
  - id: skuggsja
    main: ./cmd/skuggsja
    binary: skuggsja
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: skuggsja
    ids: [skuggsja]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

homebrew_casks:
  - name: skuggsja
    ids: [skuggsja]
    repository:
      owner: 0merUfuk
      name: homebrew-thematrix
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/0merUfuk/skuggsja
    description: Local-first Rewind for AI coding agents
    license: MIT

release:
  github:
    owner: 0merUfuk
    name: skuggsja
  prerelease: auto

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
