name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified artifacts
    if: github.repository == '0merUfuk/skuggsja'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Build versioned packages without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          args: release --clean --skip=publish
      - name: Verify packages and prepare Homebrew formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/verify-packages.py dist "$RELEASE_TAG"
          node scripts/generate-homebrew.cjs "$RELEASE_TAG" dist/checksums.txt dist/skuggsja.rb
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/skuggsja.rb
      - name: Create new release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Skuggsja $RELEASE_TAG" --notes-file dist/CHANGELOG.md
      - name: Upload and verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/*.tar.gz dist/*.zip dist/checksums.txt dist/skuggsja.rb
          # A draft release is not addressable through /releases/tags/{tag}; GitHub
          # answers 404 for drafts even with contents: write, so the newest matching
          # draft is resolved from the release list instead.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$RELEASE_TAG\" and .draft == true)) | .[0]" \
            > "$RUNNER_TEMP/skuggsja-draft-release.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          dist = Path("dist")
          paths = [*dist.glob("*.tar.gz"), *dist.glob("*.zip"), dist / "checksums.txt", dist / "skuggsja.rb"]
          expected = {path.name: path for path in paths}
          if len(paths) != 8 or len(expected) != 8:
              raise SystemExit("Expected exactly six archives, checksums.txt and skuggsja.rb")
          temporary = Path(os.environ["RUNNER_TEMP"])
          release = json.loads((temporary / "skuggsja-draft-release.json").read_text())
          if not isinstance(release, dict):
              raise SystemExit("The candidate draft release could not be located")
          if release["tag_name"] != os.environ["RELEASE_TAG"] or release["draft"] is not True or release["prerelease"] is not False:
              raise SystemExit("The candidate must remain a draft for the exact stable tag")
          assets = release["assets"]
          if len(assets) != len(expected) or {asset["name"] for asset in assets} != set(expected):
              raise SystemExit("Draft asset membership differs from the verified local packages")
          for asset in assets:
              if asset["state"] != "uploaded" or asset["size"] != expected[asset["name"]].stat().st_size:
                  raise SystemExit("A draft asset is incomplete or has the wrong size")
          downloaded = temporary / "skuggsja-draft-assets"
          downloaded.mkdir()
          subprocess.run(["gh", "release", "download", os.environ["RELEASE_TAG"], "--repo", os.environ["GITHUB_REPOSITORY"], "--dir", str(downloaded)], check=True)
          if {path.name for path in downloaded.iterdir()} != set(expected):
              raise SystemExit("Downloaded draft asset membership differs")
          for name, path in expected.items():
              if hashlib.sha256(path.read_bytes()).digest() != hashlib.sha256((downloaded / name).read_bytes()).digest():
                  raise SystemExit("A downloaded draft asset differs from the attested local bytes")
          print("Draft release verification: 8/8 uploaded assets match the attested local bytes")
          PY
      - name: Publish complete draft and confirm immutability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft == false and .immutable == true')" = true
