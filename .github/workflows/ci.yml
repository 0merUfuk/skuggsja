name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            arch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            arch: x64
          - os: windows-latest
            goos: windows
            goarch: amd64
            arch: x64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            arch: arm64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          architecture: ${{ matrix.arch }}
      - name: Verify native runner and toolchain target
        shell: bash
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { EXPECTED_GOOS: goos, EXPECTED_GOARCH: goarch, EXPECTED_ARCH: arch } = process.env;
          const platforms = { darwin: 'darwin', linux: 'linux', windows: 'win32' };
          const runners = { darwin: 'macOS', linux: 'Linux', windows: 'Windows' };
          assert.equal(process.platform, platforms[goos], 'Node must run on the expected OS');
          assert.equal(process.arch, arch, 'Node must run natively on the expected architecture');
          assert.equal(process.env.RUNNER_OS, runners[goos], 'Runner OS must match the matrix');
          assert.equal(process.env.RUNNER_ARCH, arch === 'arm64' ? 'ARM64' : 'X64', 'Runner architecture must match the matrix');
          const go = JSON.parse(execFileSync('go', ['env', '-json', 'GOOS', 'GOARCH', 'GOHOSTOS', 'GOHOSTARCH'], { encoding: 'utf8' }));
          for (const key of ['GOOS', 'GOHOSTOS']) assert.equal(go[key], goos, `${key} must match the native OS`);
          for (const key of ['GOARCH', 'GOHOSTARCH']) assert.equal(go[key], goarch, `${key} must match the native architecture`);
          console.log(`Native target verified: ${goos}/${goarch}; Node ${process.platform}/${process.arch}; runner ${process.env.RUNNER_OS}/${process.env.RUNNER_ARCH}`);
          NODE
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Frontend regression tests
        run: node --test web/source_activity_test.cjs web/usage_chart_test.cjs scripts/generate_homebrew_test.cjs
      - name: Race test
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Build installed executable
        shell: bash
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -X main.version=ci' -o bin/skuggsja${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/skuggsja
      - name: Isolated installation and first use
        run: node scripts/verify-install.cjs bin/skuggsja${{ runner.os == 'Windows' && '.exe' || '' }} ci
      - name: Verify generation and localhost UI with outbound networking denied
        if: runner.os == 'macOS'
        run: ./scripts/verify-runtime-offline.sh

  quality:
    name: Workflow and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l .)
          if [[ -n "$files" ]]; then printf '%s\n' "$files"; exit 1; fi
      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  package:
    name: Six-platform package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          args: check
      - name: Build local snapshot packages
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          args: release --snapshot --clean --skip=publish
      - name: Package verifier regression tests
        run: python3 scripts/verify_packages_test.py
      - name: Verify archives and installed native package
        run: python3 scripts/verify-packages.py dist
